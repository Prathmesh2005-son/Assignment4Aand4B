<!DOCTYPE html>
<html>
<head>
    <title>Click the Box Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #gameArea {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            margin: 20px auto;
            position: relative;
        }

        #box {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Click the Box Game</h1>
<p>Score: <span id="score">0</span></p>
<p>Time Left: <span id="time">10</span></p>
<button onclick="startGame()">Start Game</button>

<div id="gameArea">
    <div id="box"></div>
</div>

<script>
    let score = 0;
    let time = 10;
    let gameInterval;
    let moveInterval;

    const box = document.getElementById("box");

    function startGame() {
        score = 0;
        time = 10;
        document.getElementById("score").innerText = score;
        document.getElementById("time").innerText = time;

        moveBox();

        moveInterval = setInterval(moveBox, 800);

        gameInterval = setInterval(() => {
            time--;
            document.getElementById("time").innerText = time;

            if (time === 0) {
                clearInterval(gameInterval);
                clearInterval(moveInterval);
                alert("Game Over! Your score: " + score);
            }
        }, 1000);
    }

    function moveBox() {
        let x = Math.random() * 350;
        let y = Math.random() * 350;

        box.style.left = x + "px";
        box.style.top = y + "px";
    }

    box.addEventListener("click", () => {
        score++;
        document.getElementById("score").innerText = score;
        moveBox();
    });
</script>

</body>
</html>
